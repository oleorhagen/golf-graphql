stages:
  - build
  - test
  - release
  - deploy

.build:site-build-template:
  stage: build
  image: docker
  services:
    - docker
  before_script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build  --tag "$CI_REGISTRY_IMAGE/$CONTAINER_NAME:latest" .
    - docker tag "$CI_REGISTRY_IMAGE/$WEBSITE_NAME:latest" "$CI_REGISTRY_IMAGE/$WEBSITE_NAME:${CI_DEFAULT_BRANCH}-${CI_COMMIT_SHORT_SHA}-$(date +%s)"
    - docker push --all-tags "$CI_REGISTRY_IMAGE/$CONTAINER_NAME"

build:golfsite:
  extends: .build:site-build-template
  only:
    changes:
      - graph/*
      - graph/**/*
      - server.go
  variables:
    CONTAINER_NAME: "golf-graphql"
